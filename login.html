<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to GitGuide">
    <title>Login – GitGuide</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== NAVIGATION ========== -->
    <nav class="navbar" aria-label="Main navigation">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="6" cy="6" r="3"></circle>
                        <circle cx="18" cy="18" r="3"></circle>
                        <path d="M6 9v6"></path>
                        <path d="M18 15v-2a3 3 0 0 0-3-3 3 3 0 0 0-3 3v2"></path>
                    </svg>
                </span>
                GitGuide
            </a>

            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-links" id="navLinks">
                <!-- Dynamically populated by script.js based on auth state -->
            </div>
        </div>
    </nav>

    <!-- ========== MAIN CONTENT ========== -->
    <section class="section" style="min-height: calc(100vh - var(--nav-height) - 100px); display:flex; align-items:center;">
        <div class="container" style="display:flex; justify-content:center; width:100%;">
            <div class="auth-container" style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:3rem; width:100%; max-width:450px; box-shadow:var(--shadow-xl);">
                <div class="auth-header" style="text-align:center; margin-bottom:2.5rem;">
                    <div class="eyebrow" style="margin-bottom:0.5rem; justify-content:center;">Welcome Back</div>
                    <h2 style="font-size:2rem; margin-bottom:0.5rem;">Login to GitGuide</h2>
                    <p style="color:var(--text-muted);">Access your saved guides and dashboard</p>
                </div>

                <form id="loginForm">
                    <div class="form-group" style="margin-bottom:1.5rem;">
                        <label for="username" style="display:block; margin-bottom:0.5rem; font-weight:600; color:var(--text-light);">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="Enter your username" style="width:100%; padding:0.85rem; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); color:var(--text);" required>
                    </div>
                    <div class="form-group" style="margin-bottom:2rem;">
                        <label for="password" style="display:block; margin-bottom:0.5rem; font-weight:600; color:var(--text-light);">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" style="width:100%; padding:0.85rem; background:var(--background); border:1px solid var(--border); border-radius:var(--radius); color:var(--text);" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content:center; padding:0.85rem;">Login</button>
                </form>

                <div class="auth-divider" style="text-align:center; margin:2rem 0; color:var(--text-muted); position:relative; z-index:1;">
                    <span style="background:var(--surface); padding:0 1rem;">OR</span>
                    <hr style="position:absolute; top:50%; left:0; width:100%; border:0; border-top:1px solid var(--border); z-index:-1; margin:0;">
                </div>

                <a href="index.html" class="btn btn-secondary" style="width: 100%; justify-content:center; padding:0.85rem; border-color:var(--border);">Continue as Guest</a>

                <div class="auth-links" style="text-align:center; margin-top:2rem; color:var(--text-muted);">
                    Don't have an account? <a href="register.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Register here</a>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer-minimal">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand">
                    <h3>GitGuide</h3>
                </div>
                <div class="footer-links">
                    <h4>Product</h4>
                    <a href="search.html">Search</a>
                    <a href="commands.html">Commands</a>
                    <a href="troubleshooting.html">Troubleshooting</a>
                </div>
                <div class="footer-links">
                    <h4>Resources</h4>
                    <a href="search.html?category=Git+Basics">Git Basics</a>
                    <a href="search.html?category=GitHub">GitHub</a>
                    <a href="search.html?category=Branching">Branching</a>
                </div>
                <div class="footer-links">
                    <h4>Project</h4>
                    <a href="#">About</a>
                    <a href="#">GitHub</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 GitGuide</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Redirect if already logged in
            if (getCurrentUser()) {
                window.location.href = 'index.html';
            }

            var form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    var username = document.getElementById('username').value.trim();
                    var password = document.getElementById('password').value;

                    if (!username || !password) {
                        showToast('Please fill in all fields.', 'error');
                        return;
                    }

                    var result = await loginUser(username, password);
                    if (result.success) {
                        showToast(result.message, 'success');
                        setTimeout(function() {
                            window.location.href = result.role === 'admin' ? 'dashboard.html' : 'user-dashboard.html';
                        }, 1000);
                    } else {
                        showToast(result.message, 'error');
                    }
                });
            }
        });
    </script>
</body>
</html>
