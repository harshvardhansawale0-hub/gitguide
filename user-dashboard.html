<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GitGuide User Dashboard">
    <title>User Dashboard – GitGuide</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== NAVIGATION ========== -->
    <nav class="navbar" aria-label="Main navigation">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="6" cy="6" r="3"></circle>
                        <circle cx="18" cy="18" r="3"></circle>
                        <path d="M6 9v6"></path>
                        <path d="M18 15v-2a3 3 0 0 0-3-3 3 3 0 0 0-3 3v2"></path>
                    </svg>
                </span>
                GitGuide
            </a>

            <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-links" id="navLinks">
                <!-- Dynamically populated by script.js based on auth state -->
            </div>
        </div>
    </nav>

    <!-- ========== MAIN CONTENT ========== -->
    <section class="section giant-search-section" style="padding: 8rem 0 4rem;">
        <div class="container">
            <div class="giant-search-container reveal" style="text-align:left;">
                <div class="user-info-card" style="display:flex; align-items:center; gap:2rem; background:transparent;">
                    <div class="user-avatar" style="font-size:4rem; line-height:1; background:var(--surface); border:1px solid var(--border); border-radius:50%; width:100px; height:100px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-lg);">👤</div>
                    <div class="user-details">
                        <div class="eyebrow" style="margin-bottom: 0.5rem;">User Profile</div>
                        <h1 id="welcomeName" style="margin-bottom: 0.5rem; font-size:2.5rem;">Welcome, User!</h1>
                        <p style="color:var(--text-muted); font-size:1.1rem; margin:0;">Manage your saved guides and comments here.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="section" style="padding-top: 0; min-height: 400px;">
        <div class="container">
            <div class="dashboard-layout" style="display: block;">
                <!-- BOOKMARKS SECTION -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                    <h3 style="font-size: 1.5rem; margin:0;">My Bookmarks</h3>
                </div>
                <div class="article-grid" id="userBookmarksGrid" style="margin-bottom: 4rem; display:flex; flex-direction:column; gap:1rem;">
                    <!-- Bookmarked articles rendered by user-dashboard.js -->
                </div>

                <!-- COMMENTS SECTION -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                    <h3 style="font-size: 1.5rem; margin:0;">My Comments</h3>
                </div>
                <div id="userCommentsList" class="comment-list" style="margin-bottom: 3rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:2rem;">
                    <!-- User's comments rendered by user-dashboard.js -->
                </div>
            </div>
        </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer-minimal">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand">
                    <h3>GitGuide</h3>
                </div>
                <div class="footer-links">
                    <h4>Product</h4>
                    <a href="search.html">Search</a>
                    <a href="commands.html">Commands</a>
                    <a href="troubleshooting.html">Troubleshooting</a>
                </div>
                <div class="footer-links">
                    <h4>Resources</h4>
                    <a href="search.html?category=Git+Basics">Git Basics</a>
                    <a href="search.html?category=GitHub">GitHub</a>
                    <a href="search.html?category=Branching">Branching</a>
                </div>
                <div class="footer-links">
                    <h4>Project</h4>
                    <a href="#">About</a>
                    <a href="#">GitHub</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 GitGuide</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script src="js/user-dashboard.js"></script>

</body>
</html>
