# Netlify Configuration for GitGuide Frontend
[build]
  publish = "."

# SPA / Static routing
[[redirects]]
  from = "/api/*"
  to = "https://gitguide.onrender.com/api/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
