<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Eye Gradient for vibrant warm amber look -->
    <radialGradient id="catEyeGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="70%" stop-color="#FFAC00" />
      <stop offset="100%" stop-color="#E68A00" />
    </radialGradient>
    <filter id="catGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sparkle Star above head -->
  <path d="M 250 20 
           C 250 50, 265 65, 295 65 
           C 265 65, 250 80, 250 110 
           C 250 80, 235 65, 205 65 
           C 235 65, 250 50, 250 20 Z" 
        fill="#111827" />

  <!-- Body / Neck Collar Base -->
  <path d="M 215 365 
           L 285 365 
           L 305 435 
           C 270 445, 230 445, 195 435 
           Z" 
        fill="#111827" />

  <!-- Star cutout on collar -->
  <path d="M 250 375 
           C 250 390, 258 398, 273 398 
           C 258 398, 250 406, 250 421 
           C 250 406, 242 398, 227 398 
           C 242 398, 250 390, 250 375 Z" 
        fill="#FFFFFF" />

  <!-- Main Head Silhouette with Ears -->
  <path d="M 250 140
           C 310 140, 350 170, 365 210
           L 410 110
           C 400 160, 385 205, 385 240
           C 385 315, 325 355, 250 355
           C 175 355, 115 315, 115 240
           C 115 205, 100 160, 90 110
           L 135 210
           C 150 170, 190 140, 250 140 Z" 
        fill="#111827" />

  <!-- Left Whiskers (3 sleek whiskers) -->
  <path d="M 125 268 C 100 268, 70 266, 50 268 C 65 278, 95 280, 125 278 Z" fill="#111827" />
  <path d="M 135 298 C 105 305, 75 312, 60 318 C 75 328, 105 322, 135 308 Z" fill="#111827" />
  <path d="M 155 328 C 125 342, 95 358, 80 370 C 95 378, 125 362, 155 338 Z" fill="#111827" />

  <!-- Right Whiskers (3 sleek whiskers) -->
  <path d="M 375 268 C 400 268, 430 266, 450 268 C 435 278, 405 280, 375 278 Z" fill="#111827" />
  <path d="M 365 298 C 395 305, 425 312, 440 318 C 425 328, 395 322, 365 308 Z" fill="#111827" />
  <path d="M 345 328 C 375 342, 405 358, 420 370 C 405 378, 375 362, 345 338 Z" fill="#111827" />

  <!-- Left Eye - Big Golden Oval -->
  <ellipse cx="190" cy="225" rx="42" ry="46" fill="url(#catEyeGrad)" />
  <!-- Left Pupil & Highlights -->
  <ellipse cx="196" cy="225" rx="14" ry="26" fill="#111827" />
  <ellipse cx="206" cy="205" rx="6" ry="8" fill="#FFFFFF" />
  <circle cx="184" cy="242" r="3" fill="#FFFFFF" opacity="0.8" />

  <!-- Right Eye - Big Golden Oval -->
  <ellipse cx="310" cy="225" rx="42" ry="46" fill="url(#catEyeGrad)" />
  <!-- Right Pupil & Highlights -->
  <ellipse cx="304" cy="225" rx="14" ry="26" fill="#111827" />
  <ellipse cx="314" cy="205" rx="6" ry="8" fill="#FFFFFF" />
  <circle cx="292" cy="242" r="3" fill="#FFFFFF" opacity="0.8" />

  <!-- Nose -->
  <path d="M 240 252 Q 250 248 260 252 Q 250 258 240 252 Z" fill="#FFFFFF" />

  <!-- Open Cheerful Mouth / Smile -->
  <path d="M 236 270 
           C 236 270, 230 305, 250 305 
           C 270 305, 264 270, 264 270 
           Z" 
        fill="#FFFFFF" />
</svg>
